[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kalakal-agent"
version = "0.1.0"
description = "Auditable Dota 2 prediction-market agent for Jupiter prediction markets (hackathon project)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.8,<1.0",
    "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalakal = ["py.typed"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
